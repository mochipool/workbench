# 05a, 05c, 05e, 07a, 07b: pool registration and retirement. The software-key and offline
# compositions are ported; what waits is named. 05d is not an implemented code: the
# import side is covered (ImportWitness) and cited, the sign, clear and info sides come later.
"SPO-05a-OUT-010" = "display only: the use case returns a result that holds no key, and the command prints what it chooses; the descriptor with the protection key is never in a result (SPO-05a-SEC-001, cited)"
"SPO-05a-SEC-002" = "the ITN and BLS signing keys are read by an external tool from plaintext files; neither is ported (ITN refuses with ErrITNUnsupported, protocol 12 with ErrBLSRequired), so there is no such read"
"SPO-05c-OUT-004" = "display only: the hint about registering each owner's delegation certificate in a later transaction after a hardware registration; the two-phase hardware-owner flow waits for the hardware signer adapter (SPO-05c-INV-006 is cited for the attachment rule)"
"SPO-05c-OUT-007" = "temporary files in tempDir: the body, the witnesses and the signed transaction live in memory and in the store; no temporary file is written"
"SPO-05c-PR-002" = "the hardware confirmation prompt belongs to the hardware signer adapter, which does not exist yet; a hardware holder is refused by the signing plan, or left as a pending slot when AllowPending is set"
"SPO-05c-PRE-009" = "classification of cardano-hw-cli output (REJECTED, DISCONNECT, ERROR, WARNING) belongs to the hardware signer adapter, which does not exist yet; an unreadable key file is an error of the vault signer (cited by its tests)"
"SPO-05c-SEC-001" = "signing keys are opened in guarded memory by the vault signer for one witness and destroyed after it (SPO-Ptx-SEC-001, cited by the signer and parity tests); the use case never sees a key"
"SPO-05c-SEC-004" = "display only: upstream prints the descriptor with the protection key and the message passphrase; the use case returns neither and `pass:` messages are not ported"
"SPO-07a-OUT-003" = "display only: the command prints the certificate and the descriptor as it chooses"
"SPO-07b-EXT-001" = "the hardware path (canonical body form, cardano-hw-cli witness, assemble) waits for the hardware signer adapter; a hardware payer or cold key is refused by the signing plan"
"SPO-07b-SEC-002" = "no temporary file is written, so no signed transaction or body is left world-readable; `pass:` messages are not ported, so no passphrase is shown"

# 01workOffline, Ptransfer, Coffline (app/airgap, domain/transfer, adapters/transferfile): the
# snapshot, the queue, the files and `execute`. The words of the command line, the settings and the
# token registry are not the use cases'.
"SPO-01workOffline-IF-001" = "the words of the command line (new, clear, add, info, execute, attach, extract, cleartx, clearhistory, clearfiles) are the command's; each action is its own use case (NewSnapshot, AddAddress, AddDRep, InspectBundle, ExecuteTx, Attach, Extract, Clear)"
"SPO-01workOffline-IF-002" = "usage text and exit 1 for an unknown action are the command's"
"SPO-01workOffline-IN-003" = "settings (queryTokenRegistry, tokenMetaServer, transactionExplorer, tempDir, tool versions, work mode) are the composition's: the versions are Versions, the work mode decides which readers are wired, there is no registry port, the tracking link is display, and the signed transaction never touches a temporary file"
"SPO-01workOffline-EXT-004" = "token registry lookups are not ported: there is no registry port, so a snapshot carries no tokenMetaServer entries and the reports show raw policy ids, fingerprints and the asset name when it is readable text"
"SPO-Ptransfer-OUT-008" = "tokenMetaServer entries are not written: no registry port (see SPO-01workOffline-EXT-004); an existing tokenMetaServer object in a file is kept untouched by every rewrite and counted by InspectBundle"
"SPO-Ptransfer-IF-001" = "the path of the transfer file (offlineFile, default ./offlineTransfer.json, an empty setting falls back to the default) is the command's: transferfile.File takes the path it is given"

# 01queryAddress (app/query.QueryAddress).
"SPO-01queryAddress-IF-001" = "the argument count, the usage message on stdout and exit 2 are the command's; the use case takes one word and refuses an empty one"
"SPO-01queryAddress-IN-003" = "settings (queryTokenRegistry, tokenMetaServer, koiosAPI, koiosAuthorizationHeader, adahandlePolicyID, tempDir, work mode) are the composition's: the readers it wires are the mode; there is no registry or Handle port and no temporary address file"
"SPO-01queryAddress-EXT-002" = "token registry lookups are not ported: there is no registry port; assets are shown by policy id, name (hex and readable text) and CIP-14 fingerprint"
"SPO-01queryAddress-SEC-001" = "no secret is read or printed: the use case holds no vault. The third-party lookups it names are the registry (not ported, SPO-01queryAddress-EXT-002), the Handle API (refused, ErrAdaHandleUnsupported) and the pool description, made only through the optional PoolStateReader and never offline"

# 04e (app/query.CheckOpCert and QueryOpCertCounter): a verdict as data.
"SPO-04e-IF-002" = "usage text and exit 1 for a missing or invalid argument are the command's; the use case refuses a check that is not current or next"
"SPO-04e-IF-003" = "three or more arguments select no subject and exit 0: the command's; each subject is its own use case (CheckOpCert, QueryOpCertCounter)"
"SPO-04e-MODE-002" = "online mode asks the node for kes-period-info and reads the counters from its answer: not ported, there is no node adapter. The use case computes the same facts from the tip, the genesis and the certificate, and reads the on-chain counter through an OpCertCounterReader, whichever provider backs it"
"SPO-04e-PR-001" = "the question 'use the pool id from the file?' is the command's; the use case takes the pool name and reads its stored `.pool.id-bech`, and the command asks before calling it"

# Xparty (app/parties, app/multisig, adapters/envelope, partystore, filebag, tailcat).
"SPO-Xparty-IF-008" = "`party rotate` is not implemented: it needs a rotation statement signed by the old key and a second fingerprint confirmation on the peer (a separate change); an identity that must change is replaced by revoking it and enrolling a new one"

# Governance family (21a to 25b): software-key paths. Hardware holders are refused up front by
