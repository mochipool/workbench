# signing and the offline queue are ported; a hardware holder, of either key, is refused up
# front by the signing plan (ADR 0008), which covers every hardware/key-file combination.
"SPO-03b-EXT-003" = "hardware path (the sed of the tag-258 wrapper, cardano-hw-cli witness and assemble): waits for the hardware signer adapter; a hardware-held key is refused by the signing plan"
"SPO-08b-EXT-002" = "hardware path (cardano-hw-cli witness with both signing files, then assemble): waits for the hardware signer adapter; a hardware-held key is refused by the signing plan"
"SPO-22b-EXT-001" = "hardware path (cardano-hw-cli witness with both signing files, then assemble); the key-file path is the vault signer, byte-equal to cardano-cli in the parity test: waits for the hardware signer adapter"
"SPO-08b-EXT-003" = "`transaction sign` of cardano-cli with the network flag: signing is native (VaultSigner), witnesses and assembled transaction are byte-equal to `transaction sign` in the oracle test, and there is no network flag to pass"
"SPO-03c-PRE-001" = "upstream refuses offline mode; the use case answers from whatever RewardAccountReader it is given, including the offline snapshot (the port note of 03c recommends it), so the refusal is the composition's choice, not the use case's"
"SPO-06-IF-002" = "Pparam is not ported: of the extra parameters only plain `msg:` lines exist, as the request's Message (validated for the 64-byte limit); metadata files, utxo filters and enc/pass are refused by not being offered"
"SPO-08b-IF-002" = "Pparam is not ported: of the extra parameters only plain `msg:` lines exist, as the request's Message (validated for the 64-byte limit); metadata files, utxo filters and enc/pass are refused by not being offered"
"SPO-22b-IF-002" = "Pparam is not ported: of the extra parameters only plain `msg:` lines exist, as the request's Message (validated for the 64-byte limit); metadata files, utxo filters and enc/pass are refused by not being offered"
"SPO-01claimRewards-IF-006" = "Pparam is not ported: of the extra parameters only plain `msg:` lines exist, as the request's Message (validated for the 64-byte limit); metadata files, utxo filters and enc/pass are refused by not being offered"
"SPO-01claimRewards-IF-004" = "the fee payer is an explicit ClaimRequest.Payer (the port note), not a word recognised by the existence of `<word>.addr`; the command decides how to read its words"

