"SPO-21a-OUT-004" = "the hardware path waits for the hardware signer adapter, which does not exist yet; a hardware-held key is refused up front by the signing plan (ADR 0008), tested under the hardware refusal tests of the script"
"SPO-21a-PR-001" = "enc mode not ported at generation (the decision of 04c and 03a): every signing key goes into the store, whose sealing is the protection; no per-key password and no gpg envelope"
"SPO-21a-PR-002" = "enc mode not ported at generation (the decision of 04c and 03a): every signing key goes into the store, whose sealing is the protection; no per-key password and no gpg envelope"
"SPO-21a-PRE-008" = "enc mode not ported at generation (the decision of 04c and 03a): every signing key goes into the store, whose sealing is the protection; no per-key password and no gpg envelope"
"SPO-21a-PRE-009" = "enc mode not ported at generation (the decision of 04c and 03a): every signing key goes into the store, whose sealing is the protection; no per-key password and no gpg envelope"
"SPO-21a-PRE-010" = "no external cardano-signer is run: key derivation is native (byte-equal to cardano-signer in TestGovMnemonicKeysMatchUpstream) and the CIP-100 verifier is an optional port (ErrAnchorVerifierMissing)"
