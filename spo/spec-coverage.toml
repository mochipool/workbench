# Ckey, 01protectKey, Pfiles: key protection and the workspace import/export (app/workspace,
# adapters/gpg, domain/keyfile). 0x_importHelper (ImportPoolFromChain) is not ported yet.
"SPO-01protectKey-IF-001" = "command-line usage and argument parsing belong to the `spo` command that wires ProtectKey and UnprotectKey; the use cases take a Ref and a password"
"SPO-01protectKey-IF-002" = "command-line usage and argument parsing belong to the command: the action is the choice of ProtectKey or UnprotectKey"
"SPO-01protectKey-IF-003" = "file lookup by name (with or without .skey) belongs to the command and to the store's name mapping (SPO-Pfiles-IN-001, cited in the fsstore tests); the use cases take a Ref"
"SPO-01protectKey-IF-004" = "extra command-line arguments belong to the command; the use cases take exactly one Ref"
"SPO-01protectKey-PR-003" = "display only: the port never shows a password"
"SPO-01protectKey-SEC-002" = "display only: the port never shows a password"
"SPO-01protectKey-SEC-003" = "display only: the port prints no file content; reports carry names and fixed phrases"
"SPO-01protectKey-SEC-004" = "display only: the plaintext key is never printed; UnprotectKey writes it to the file and to nothing else (TestReportHoldsNoSecret covers reports)"
"SPO-01protectKey-SEC-005" = "display only: the plaintext key is never printed after the write"
"SPO-Ckey-IF-002" = "read_skeyFILE returns key text on stdout; the port's Vault.Open returns a guarded buffer and the use cases never turn it into text (ADR 0004)"
"SPO-Ckey-IN-002" = "ENV_DECRYPT_PASSWORD is not read: the password is a *Secret given by the caller, so no environment variable holds it (the point of SPO-Ckey-SEC-003)"
"SPO-Ckey-PRE-009" = "ENV_DECRYPT_PASSWORD is not read (SPO-Ckey-IN-002); a wrong password is ports.ErrWrongPassphrase after one attempt per candidate, never a retry loop"
"SPO-Ckey-OUT-004" = "the single-line printf output of read_skeyFILE has no counterpart: no key text is returned, and the plain envelope the use cases write is the cardano-cli form (SPO-Ckey-OUT-002 for 01_protectKey dec)"
"SPO-Ckey-PR-002" = "decision: a password that is not strong is tried like any other. Upstream skipped it only to avoid a pointless gpg call and a prompt loop; the port has neither, and a legacy envelope can only exist for a strong password, so the shortcut changes no outcome"
"SPO-Ckey-SEC-004" = "the upstream-compatible envelope is the interchange format and has no integrity binding by definition; binding type and description belongs to the sealed store's own record format, which this work does not touch"
"SPO-Pfiles-IN-004" = "configuration files and tool binaries are read by the config and toolchain adapters, not by the workspace use cases"
"SPO-Pfiles-INV-001" = "the importer recognises a hardware key by its .hwsfile (SPO-Pfiles-OUT-004, SPO-Pfiles-INV-002); it never reads or rewrites the Hardware marker in a verification key description"
"SPO-Pfiles-OUT-038" = "0x_importHelper (ImportPoolFromChain) is not ported yet: it needs the chain query of the pool and the operator's key paths; ImportWorkspace covers a directory that already has the layout"
"SPO-Pfiles-OUT-039" = "temporary transaction files are an implementation detail of the cardano-cli pipeline; the port builds transactions in memory (SPO-Ptx-OUT-003) and the gpg adapter writes no secret to any file (observer test in adapters/gpg)"

