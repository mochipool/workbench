"SPO-10-INV-003" = "enc mode not ported at generation: the store's protection replaces it (same decision as 04c); the signing key is never written outside the store"
"SPO-10-PR-001" = "enc mode not ported at generation: no per-key password prompt (same decision as 04c)"
"SPO-10-PR-002" = "enc mode not ported at generation: the port never displays a password"
"SPO-10-PRE-002" = "enc mode not ported at generation: no password prompt to abort"
"SPO-10-PRE-003" = "enc mode not ported at generation: there is no interactive phase to interrupt, and generation is atomic"
"SPO-10-OUT-003" = "enc mode not ported at generation: the gpg envelope is written by the key-protection use case"
"SPO-10-SEC-002" = "enc mode not ported at generation: the port never displays a password"
"SPO-10-OUT-001" = "a policy name is a plain label with no directory part (hazard H7), so there is no directory to create; GeneratePolicy refuses `dir/name`"
"SPO-10-SEC-001" = "the port never prints a signing key: GeneratePolicy returns no key material and writes the key only into the sealed store"
"SPO-10-SEC-003" = "advice on custody of the policy key (a time lock is the only protection that does not depend on custody), not behaviour"
"SPO-11a-IN-004" = "settings are the composition's: the approval policy, DefTTL and the clock are fields of Base; the token registry display, cropTxOutput and transactionExplorer are display settings with no port yet"
"SPO-11a-PR-002" = "the hardware payment witness prompt is the device's own; the change-key declaration is shared (wallet.hardwareChangeKeys and txflow.Input.HardwareChangeKeys); a hardware policy or payment key is planned through the signing plan, tested for the policy key's generation and policy id (SPO-10-EXT-005), not for a mint"
"SPO-11a-SEC-002" = "statement about the authority of the policy key, not behaviour"
"SPO-11b-EXT-002" = "the hardware canonicalisation and witnesses of a burn are the shared pipeline (txflow.BuildCtx); no hardware test drives 11b itself, only 11a's plan shape through the policy key's generation"
"SPO-11b-SEC-002" = "statement about the loss of a policy key, not behaviour"
"SPO-Pparam-IF-017" = ".vote and .action files of 24b and 25b belong to the governance use cases, which take their files by name; not part of txparam"
"SPO-Pparam-IF-018" = "05c refuses metadata once a witness collection is open: the pool registration use case does not take extra parameters yet"
"SPO-Pparam-IF-024" = "`type:REG|REREG` is a switch of 05c; the pool registration use case takes an explicit mode, and txparam has no row for it"
"SPO-Pparam-IF-027" = "acc: and idx: belong to the key-generation commands (03a, 21a, 23a, 23b), which parse them; txparam is the grammar of transaction scripts"
