# Relay b: the base instance with its own name, configuration and key Secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/instance
nameSuffix: "-b"
labels:
  - pairs:
      app.kubernetes.io/instance: spo-relay-b
    includeSelectors: true
configMapGenerator:
  - name: spo-relay-config
    namespace: spo-relay
    behavior: replace
    files:
      - relay.toml
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: key-secret.yaml
