# One relay: one pod with its own key, its own configuration and its own claim.
#
# replicas stays 1. The pods of one StatefulSet share its template, so a second
# replica would serve the same relay key: one key is one live tailcat endpoint,
# and each store is held by one process (a flock in the store directory). Run
# more relays as more instances (see ../../overlays/example), each with its own
# Secret, and list all of them on every device.
#
# The pod runs as uid and gid 10001 with no capability. The key Secret is seen
# only by the init container, which copies it into a memory volume with the
# mode spo-relay demands (a regular file of the relay's own user, no group or
# other bit; a Secret volume's files belong to root, so the relay would refuse
# them). docs/how-to/run-a-relay-on-kubernetes.md explains each choice.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spo-relay
  namespace: spo-relay
  labels:
    app.kubernetes.io/name: spo-relay
    app.kubernetes.io/instance: spo-relay
spec:
  replicas: 1
  # No Service is made: the relay takes no inbound connection. The name is only
  # the StatefulSet's governing service, which nothing resolves.
  serviceName: spo-relay
  podManagementPolicy: OrderedReady
  # With one replica, a rolling update deletes the old pod and waits until it
  # is gone before the new one starts, so one key is never served twice.
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: spo-relay
      app.kubernetes.io/instance: spo-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spo-relay
        app.kubernetes.io/instance: spo-relay
    spec:
      serviceAccountName: spo-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      # Above the relay's teardown bound (20 s: sessions, tunnel, sweeper) plus
      # the stores' close. A SIGKILL inside the bound would cut the teardown.
      terminationGracePeriodSeconds: 45
      # Put the relays of the namespace on different nodes where there is room:
      # two relays on one node fall together.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: spo-relay
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup lets uid 10001 write the claim's root and read the Secret
        # (mode 0440, group 10001). OnRootMismatch keeps kubelet from changing
        # every file at each start: a recursive change adds group bits to the
        # stores' 0600 files and 0700 directories, and the stores refuse them.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-key
          image: docker.io/library/busybox:1.37@sha256:FILL_IN_DIGEST_OF_BUSYBOX
          command:
            - /bin/sh
            - "-c"
            - |
              set -eu
              install -d -m 0700 /data/state /run/spo-relay/key
              install -m 0600 /secret/relay.key /run/spo-relay/key/relay.key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 1Mi
            limits:
              memory: 32Mi
              ephemeral-storage: 4Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: relay-key
              mountPath: /secret
              readOnly: true
            - name: run
              mountPath: /run/spo-relay
      containers:
        - name: relay
          image: registry.example/spo-relay:0.1.0@sha256:FILL_IN_DIGEST_OF_SPO_RELAY
          # Never make serve print the address here: the container log would
          # keep it, and it holds the pre-shared key.
          args:
            - serve
            - "--config"
            - /etc/spo-relay/relay.toml
          env:
            - name: GOMEMLIMIT
              value: "400MiB"
          # spo-relay offers no health endpoint and no ready file, so there is
          # no probe; the process exits on a failure (status 3 when its tunnel
          # did not stop) and kubelet restarts it.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 1Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/spo-relay
              readOnly: true
            - name: data
              mountPath: /data
            - name: run
              mountPath: /run/spo-relay
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: spo-relay-config
            # 0444 (decimal 292): root's file, readable by the relay with or
            # without fsGroup, writable by nobody, which the relay requires.
            defaultMode: 292
        - name: relay-key
          secret:
            # Made out of band, one per relay: never put it in this directory.
            secretName: spo-relay-key
            # 0440 (decimal 288): root's file, group 10001 by fsGroup.
            defaultMode: 288
            items:
              - key: relay.key
                path: relay.key
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Nothing in spo-relay is known to write to /tmp; this keeps a library
        # that does from failing on the read-only root.
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # ReadWriteOncePod needs a CSI driver; with another use ReadWriteOnce
        # (the single replica keeps one pod on the claim).
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 10Gi
